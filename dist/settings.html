<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTW Settings</title>
    <script type="module" crossorigin src="./assets/script-n_9QgYyk.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/script-CocLeXi1.css">
  </head>
  <body data-page="settings">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="profile-box">
          <div class="avatar">AD</div>
          <div>
            <div class="profile-name" data-profile-outlet>BTW Hospitality</div>
            <small data-profile-manager>Audit Team</small>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a class="nav-item" href="checklist.html">Overview</a>
          <a class="nav-item" href="reports.html">Reports</a>
          <a class="nav-item active" href="settings.html">Settings</a>
          <a class="nav-item" href="section-1.html">Preparing for Success</a>
          <a class="nav-item" href="section-2.html">Service &amp; Hospitality</a>
          <a class="nav-item" href="section-3.html">Quality &amp; Product</a>
          <a class="nav-item" href="section-4.html">Cleanliness &amp; Maintenance</a>
          <a class="nav-item" href="section-5.html">Showroom &amp; Operations</a>
        </nav>
      </aside>

      <main class="dashboard-main">
        <header class="dashboard-header">
          <div>
            <p class="eyebrow">Admin Controls</p>
            <h1>System Settings</h1>
          </div>
          <div class="header-actions">
            <button type="button" class="ghost small" id="themeToggle">🌙 Dark</button>
            <button type="button" class="primary small" id="exportBtn">Export PDF</button>
            <button type="button" class="ghost small" id="logoutBtn">Logout</button>
          </div>
        </header>

        <section class="settings-grid">
          <article class="module-panel settings-card">
            <div class="panel-header">
              <h2>Outlet profile</h2>
            </div>

            <form id="profileForm">
              <div class="settings-list compact">
                <div class="field-group">
                  <label for="outletName">Outlet name</label>
                  <input id="outletName" type="text" placeholder="e.g. Al Nahda Branch" />
                </div>
                <div class="field-group">
                  <label for="managerName">Manager name</label>
                  <input id="managerName" type="text" placeholder="e.g. H. Ahmed" />
                </div>
                <div class="field-group">
                  <label for="locationName">Location</label>
                  <input id="locationName" type="text" placeholder="e.g. Dubai, UAE" />
                </div>
                <div class="field-group">
                  <label for="auditDate">Last audit date</label>
                  <input id="auditDate" type="date" />
                </div>
                <button type="submit" class="primary">Save outlet profile</button>
                <div id="profileStatus" class="login-error" style="min-height: 18px; color: var(--success);"></div>
              </div>
            </form>
          </article>

          <article class="module-panel settings-card">
            <div class="panel-header">
              <h2>Audit preferences</h2>
            </div>
            <div class="settings-list">
              <label class="switch-row"><span>Daily reminder emails</span><input type="checkbox" checked /></label>
              <label class="switch-row"><span>Auto-save checklist drafts</span><input type="checkbox" checked /></label>
              <label class="switch-row"><span>Manager approval required</span><input type="checkbox" checked /></label>
            </div>
          </article>

          <article class="module-panel settings-card">
            <div class="panel-header">
              <h2>Branding</h2>
            </div>
            <div class="settings-list compact">
              <div class="field-group">
                <label>Company name</label>
                <input type="text" value="BTW Hospitality" />
              </div>
              <div class="field-group">
                <label>Primary color</label>
                <input type="color" value="#b81d24" />
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>

  </body>
</html>
